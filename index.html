<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hisob-kitob</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #eff1f4);
  --text: var(--tg-theme-text-color, #15171b);
  --hint: var(--tg-theme-hint-color, #858b95);
  --accent: var(--tg-theme-button-color, #2d7fe0);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --line: rgba(128,128,128,.2);
  --exp: #d4433b;
  --inc: #1c9a55;
  --tr: #6a6fd1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tg]){ --bg:#1b1d22; --bg2:#121316; --text:#eceef2; --hint:#8b909a; --accent:#5b9cf0; --exp:#ef6a62; --inc:#3fc27c; --tr:#9a9ef0; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 96px}
[hidden]{display:none!important}
.bal,.sum,td,.bar b,.kv b,#amt,#amt2{font-variant-numeric:tabular-nums}

.card{background:var(--bg);border-radius:14px;padding:14px 16px;margin-bottom:10px}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
.empty{color:var(--hint);text-align:center;margin:18px 8px}
.hint{color:var(--hint);font-size:13px;margin:8px 4px}
.lbl{color:var(--hint);font-size:13px}

.month{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.month h1{font-size:17px;font-weight:600;margin:0}
.mnav{width:40px;height:36px;border-radius:10px;font-size:22px;color:var(--accent)}

.summary{padding:18px 16px 14px}
.bal{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 12px}
.bal.neg{color:var(--exp)}
.split{display:flex;gap:10px}
.split div{flex:1;background:var(--bg2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--hint)}
.split b{display:block;font-size:16px;color:var(--text)}
.split .inc b{color:var(--inc)} .split .exp b{color:var(--exp)}

.actions{display:flex;gap:8px;margin-bottom:10px}
.big{flex:1;height:52px;border-radius:14px;font-weight:600;font-size:15px}
.big.exp,.big.inc,.big.tr{color:#fff}
.big.exp{background:var(--exp)} .big.inc{background:var(--inc)} .big.tr{background:var(--tr);flex:.7}

.list{padding:6px 0}
.list h3{font-size:13px;font-weight:500;color:var(--hint);margin:12px 16px 4px}
.row{display:flex;width:100%;align-items:center;gap:10px;padding:9px 16px;text-align:left}
.row:active{background:var(--bg2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--hint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{font-weight:600;white-space:nowrap}
.inc{color:var(--inc)} .exp{color:var(--exp)} .tr{color:var(--tr)}

/* qo'shish */
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;color:var(--hint)}
#add[data-kind="x"] .seg button[data-kind="x"]{background:var(--exp);color:#fff}
#add[data-kind="t"] .seg button[data-kind="t"]{background:var(--inc);color:#fff}
#add[data-kind="o"] .seg button[data-kind="o"]{background:var(--tr);color:#fff}
.amount{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0 10px}
#amt{width:100%;border:0;background:transparent;text-align:center;font-size:46px;font-weight:700;letter-spacing:-1px;padding:0;outline:none;caret-color:var(--accent)}
#add[data-kind="x"] #amt{color:var(--exp)} #add[data-kind="t"] #amt{color:var(--inc)} #add[data-kind="o"] #amt{color:var(--tr)}
#amt::placeholder{color:var(--line)}
#curBtn{color:var(--accent);font-size:15px;font-weight:600;padding:4px 12px;border-radius:14px;background:var(--bg)}
#curBtn:disabled{color:var(--hint);background:none}
.lab{font-size:13px;color:var(--hint);margin:6px 4px 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--bg);border-radius:18px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-text)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 2px 8px;font-size:14px}
.crumbs button{color:var(--accent);padding:4px 2px}
.crumbs button:last-child{color:var(--text);font-weight:600}
.crumbs span{color:var(--hint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cell{background:var(--bg);border-radius:12px;padding:12px;min-height:50px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px}
.cell i{font-style:normal;color:var(--hint)}
.cell.on{background:var(--accent);color:var(--accent-text)}
.grid .empty{grid-column:1/-1}
.fields{padding:4px 16px}
.fields input{width:100%;border:0;background:transparent;padding:12px 0;outline:none}
.fields input+input,.fields .chips+input{border-top:1px solid var(--line)}
.danger{width:100%;height:44px;border-radius:14px;background:none;color:var(--exp);font-weight:500;margin-top:6px}
.primary{width:100%;height:50px;border-radius:14px;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:16px}
.primary:disabled{opacity:.45}
.secondary{width:100%;height:46px;border-radius:14px;background:var(--bg);color:var(--accent);font-weight:600;margin-bottom:6px}

/* hisobot */
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.kv span{color:var(--hint)}
.kv.total{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.kv.total b{font-size:18px}
.bar{margin:0 0 10px}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
.bl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}
.track i.exp{background:var(--exp)} .track i.inc{background:var(--inc)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--hint);font-weight:500;text-align:right;padding:4px 0 6px 8px}
td{text-align:right;padding:7px 0 7px 8px;border-top:1px solid var(--line);white-space:nowrap}
td:first-child,th:first-child{text-align:left;padding-left:0;white-space:normal}

/* hisoblar */
.acc{padding:11px 16px;border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc .top{display:flex;justify-content:space-between;gap:10px}
.acc .top b{font-weight:600;white-space:nowrap}
.acc .top b.neg{color:var(--exp)}
.acc small{color:var(--hint);font-size:12.5px;display:block}
.inv{display:flex;gap:6px;margin-top:8px}
.inv input{flex:1;min-width:0;border:0;border-radius:9px;background:var(--bg2);padding:8px 10px;outline:none}
.inv button{padding:0 12px;border-radius:9px;background:var(--bg2);color:var(--accent);font-weight:600}

/* sozlamalar */
.irow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.irow input{flex:1;border:0;background:transparent;padding:11px 0;outline:none}
.irow button,.arow button{width:36px;height:36px;color:var(--hint);font-size:15px}
.arow{display:grid;grid-template-columns:.8fr 1fr 1.3fr 36px;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.arow .an{grid-column:1/-1}
.arow input,.arow select,.rate input,textarea{border:0;border-radius:9px;background:var(--bg2);padding:9px 10px;outline:none;min-width:0;width:100%}
.rate{display:flex;align-items:center;gap:10px}
.rate span{white-space:nowrap}
textarea{min-height:110px;resize:vertical;font-size:13px;margin-bottom:8px}
.link{color:var(--accent);padding:12px 0 4px;font-weight:500}
.filebtn{display:inline-block;color:var(--accent);font-weight:500;margin:0 0 10px;cursor:pointer}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;max-width:140px;height:54px;font-size:13px;color:var(--hint);font-weight:500}
.tabs button.on{color:var(--accent);font-weight:600}

.due{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:14px;padding:12px 16px;margin-bottom:10px;border-left:4px solid var(--tr)}
.due.late{border-left-color:var(--exp)}
.due small{display:block;color:var(--hint);font-size:12.5px}
.due button{background:var(--accent);color:var(--accent-text);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.arow .ext{grid-column:1/-1;display:grid;grid-template-columns:1fr .5fr 1fr;gap:6px}
.arow .ext input[type=month]{grid-column:1/-1}
.sec{font-size:13px;color:var(--hint);margin:10px 16px 2px}
.pl .kv{padding:4px 0;font-size:14.5px}
.pl .kv.sub{font-size:13.5px;padding:2px 0}
.pl .kv.sub span{padding-left:14px}
.pl .kv.sub b{font-weight:500;color:var(--hint)}
.pl .gap{height:8px}
details.bar summary{list-style:none;cursor:pointer}
details.bar .bl{align-items:center}
details.bar .bl b{display:flex;align-items:center;white-space:nowrap}
details.bar summary::-webkit-details-marker{display:none}
details.bar .bl .arr{display:inline-block;color:var(--hint);margin-left:6px;transition:transform .15s;overflow:visible}
details.bar[open] .bl .arr{transform:rotate(90deg)}
details.bar .det{margin:8px 0 4px;padding:8px 10px;background:var(--bg2);border-radius:10px}
details.bar .det .kv.sub{font-size:13.5px;padding:2px 0}
details.bar .det .kv.sub b{font-weight:600}
.its{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.it{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;color:var(--hint)}
.it span{min-width:0}
.it i{font-style:normal;opacity:.8}
.it b{font-weight:500;color:var(--text);white-space:nowrap}
.quick{display:flex;gap:8px;background:var(--bg);border-radius:14px;padding:6px 6px 6px 14px;margin-bottom:6px;align-items:center}
.quick input{flex:1;border:0;background:transparent;outline:none;padding:8px 0;min-width:0}
.quick button{width:42px;height:42px;border-radius:11px;background:var(--accent);color:var(--accent-text);font-size:18px;flex:none}
.qhint{color:var(--hint);font-size:12px;margin:0 6px 10px}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:rgba(20,20,24,.9);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{text-align:center;color:var(--hint);padding:60px 20px}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <p id="loading">Yuklanmoqda…</p>

  <header class="month" id="monthBar" hidden>
    <button class="mnav" data-act="prev" aria-label="Oldingi oy">‹</button>
    <h1 id="monthTitle"></h1>
    <button class="mnav" data-act="next" aria-label="Keyingi oy">›</button>
  </header>

  <main id="home" hidden>
    <section class="card summary">
      <div class="lbl">Oy natijasi: tushum − xarajat − qarz to'lovlari</div>
      <div class="bal" id="bal">0</div>
      <div class="split">
        <div class="inc">Tushum<b id="sumInc">0</b></div>
        <div class="exp">Xarajat<b id="sumExp">0</b></div>
      </div>
      <div class="lbl" id="payNote" style="margin-top:8px"></div>
    </section>
    <div class="quick"><input id="quick" autocomplete="off" enterkeyhint="send" placeholder="Nima uchun, qancha, qaysi hisobdan"><button data-act="quick" aria-label="Qo'shish">➤</button></div>
    <p class="qhint" id="qhint">Bir gap bilan yozing yoki 🎤 bilan ayting: <b>nima uchun · qancha · qaysi hisobdan</b>. Ilova o'zi to'ldiradi, siz faqat tekshirib saqlaysiz.</p>
    <div id="dueBox"></div>
    <div class="actions">
      <button class="big exp" data-act="add-x">− Xarajat</button>
      <button class="big inc" data-act="add-t">+ Tushum</button>
      <button class="big tr" data-act="add-o" aria-label="O'tkazma">⇄</button>
    </div>
    <section class="card list" id="list"></section>
  </main>

  <main id="report" hidden></main>
  <main id="accounts" hidden></main>
  <main id="settings" hidden></main>

  <main id="add" hidden>
    <div class="seg">
      <button data-kind="x">Xarajat</button>
      <button data-kind="t">Tushum</button>
      <button data-kind="o">O'tkazma</button>
    </div>
    <div class="amount">
      <input id="amt" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Summa">
      <button id="curBtn">so'm</button>
    </div>
    <div id="accBox"></div>
    <div id="catBox">
      <nav class="crumbs" id="crumbs"></nav>
      <div class="grid" id="grid"></div>
    </div>
    <div class="card fields" id="itemBox" hidden>
      <div class="lab" style="margin:10px 0 6px">Mahsulot</div>
      <div class="chips" id="itemChips"></div>
      <input id="itemNew" maxlength="60" placeholder="Yangi mahsulot nomi">
      <input id="qty" inputmode="decimal" placeholder="Soni (dona)">
      <p class="hint" id="itemHint" style="margin:0 0 10px"></p>
    </div>
    <div class="card fields">
      <input id="note" maxlength="200" placeholder="Izoh (ixtiyoriy)">
      <input id="date" type="date" aria-label="Sana">
    </div>
    <button id="save" class="primary" disabled>Saqlash</button>
  </main>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="home">Asosiy</button>
  <button data-tab="report">Hisobot</button>
  <button data-tab="accounts">Hisoblar</button>
  <button data-tab="settings">Sozlamalar</button>
</nav>
<div id="toast" role="status"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const ver = v => inTg && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
if (inTg) {
  document.documentElement.dataset.tg = "1";
  tg.ready(); tg.expand();
  try { if (ver("6.1")) { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } } catch (e) {}
  try { if (ver("7.7")) tg.disableVerticalSwipes(); } catch (e) {}
}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const fmt = n => grp(String(Math.round(Math.abs(n))));
const fmtN = n => { const x = Math.abs(n); const s = Number.isInteger(x) ? String(x) : x.toFixed(2); const [i, f] = s.split("."); return grp(i) + (f ? "," + f : ""); };
const sfmt = n => (n < 0 ? "−" : "") + fmt(n);
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const parseNum = s => +(String(s ?? "").replace(/[\s\u00a0]/g, "").replace(",", ".").replace(/[^\d.]/g, "")) || 0;
const MONTHS = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentyabr","Oktyabr","Noyabr","Dekabr"];

function haptic(type) {
  try { if (ver("6.1")) type === "select" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
}
let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}
function ask(msg) {
  return new Promise(res => { if (ver("6.2")) tg.showConfirm(msg, ok => res(!!ok)); else res(confirm(msg)); });
}

/* ================= SAQLASH ================= */
const store = (() => {
  const cloud = ver("6.9") && tg.CloudStorage;
  const mem = {};
  const lsGet = k => { try { return localStorage.getItem("hk_" + k); } catch (e) { return mem[k] ?? null; } };
  const lsSet = (k, v) => { try { localStorage.setItem("hk_" + k, v); } catch (e) { mem[k] = v; } };
  const lsDel = k => { try { localStorage.removeItem("hk_" + k); } catch (e) { delete mem[k]; } };
  const call = (fn, ...a) => new Promise((res, rej) => fn.call(tg.CloudStorage, ...a, (err, val) => err ? rej(err) : res(val)));
  return {
    mode: cloud ? "cloud" : "local",
    async get(keys) {
      const out = {};
      for (let i = 0; i < keys.length; i += 20) {
        const part = keys.slice(i, i + 20);
        if (cloud) Object.assign(out, await call(tg.CloudStorage.getItems, part));
        else part.forEach(k => out[k] = lsGet(k));
      }
      return out;
    },
    async set(k, v) { if (cloud) return call(tg.CloudStorage.setItem, k, v); lsSet(k, v); },
    async del(keys) { if (!keys.length) return; if (cloud) return call(tg.CloudStorage.removeItems, keys); keys.forEach(lsDel); }
  };
})();

const DEF_ACCOUNTS = [
  { id: "uzum", name: "Uzum karta", cur: "UZS", type: "card", open: 0 },
  { id: "ipak", name: "Ipak Yo'li karta", cur: "UZS", type: "card", open: 0 },
  { id: "kapital", name: "Kapital karta", cur: "UZS", type: "card", open: 0 },
  { id: "naqd", name: "Naqd so'm", cur: "UZS", type: "cash", open: 0 },
  { id: "naqdusd", name: "Naqd dollar", cur: "USD", type: "cash", open: 0 },
  { id: "yandex", name: "Yandex balans", cur: "UZS", type: "card", open: 0 },
  { id: "imon", name: "Imon Invest", cur: "UZS", type: "invest", open: 0 },
  { id: "binance", name: "Binance (USDT)", cur: "USD", type: "invest", open: 0 }
];
let cfg = { family: [], cars: [], biz: [], accounts: DEF_ACCOUNTS, rate: 12500, lastAcc: "" };
let idx = {}, DB = {};
const broken = new Set();
let queue = Promise.resolve();
const enqueue = fn => (queue = queue.catch(() => {}).then(fn));
const saveCfgStore = () => enqueue(() => store.set("cfg", JSON.stringify(cfg)));

function splitSafe(s, n) {
  const out = []; let i = 0;
  while (i < s.length) {
    let j = Math.min(i + n, s.length);
    if (j < s.length) { const c = s.charCodeAt(j - 1); if (c >= 0xD800 && c <= 0xDBFF) j--; }
    out.push(s.slice(i, j)); i = j;
  }
  return out;
}
async function load() {
  const base = await store.get(["cfg", "idx"]);
  if (base.cfg) try { cfg = Object.assign({}, cfg, JSON.parse(base.cfg)); } catch (e) {}
  if (base.idx) try { idx = JSON.parse(base.idx); } catch (e) {}
  const keys = [];
  for (const [mk, n] of Object.entries(idx)) for (let i = 0; i < n; i++) keys.push(`m${mk}_${i}`);
  const vals = await store.get(keys);
  for (const [mk, n] of Object.entries(idx)) {
    let s = ""; for (let i = 0; i < n; i++) s += vals[`m${mk}_${i}`] || "";
    try { DB[mk] = JSON.parse(s).map(fixLegacy); } catch (e) { DB[mk] = []; broken.add(mk); }
  }
}
async function saveMonth(mk) {
  const arr = DB[mk] || [];
  const parts = arr.length ? splitSafe(JSON.stringify(arr), 3500) : [];
  await Promise.all(parts.map((p, i) => store.set(`m${mk}_${i}`, p)));
  const old = idx[mk] || 0;
  if (parts.length) idx[mk] = parts.length; else delete idx[mk];
  await store.set("idx", JSON.stringify(idx));
  const extra = []; for (let i = parts.length; i < old; i++) extra.push(`m${mk}_${i}`);
  await store.del(extra);
}

/* ================= KATEGORIYALAR ================= */
const CAT = { FAMILY: "👨‍👩‍👧 Oila", CAR: "🚗 Mashina", BIZ: "📦 Biznes" };
const FAM_ITEMS = ["Kiyim", "O'qish/kurs", "Dori-darmon", "Cho'ntak puli", "Ovqat/shirinlik", "Boshqa"];

function treeAyol(kind) {
  const KID = ["Kiyim-kechak", "Poyabzal", "Maktab/bog'cha", "O'quv qurollari", "To'garak/kurs", "O'yinchoq", "Dori-darmon", "Shirinlik/ovqat", "Cho'ntak puli", "Boshqa"];

function tree(kind) {
  if (cfg.preset === "ayol") return treeAyol(kind);
  const fam = {}; cfg.family.forEach(n => fam[n] = FAM_ITEMS);
  fam["Umumiy oila"] = ["To'y-marosim", "Sovg'a", "Sayohat", "Bayram", "Boshqa"];
  const cars = {}, biz = {};
  cfg.cars.forEach(c => cars[c] = kind === "x" ? CAR_X : CAR_T);
  cfg.biz.forEach(b => biz[b] = kind === "x" ? BIZ_X : BIZ_T);
  if (kind === "x") return {
    "🛒 Oziq-ovqat": ["Bozor", "Supermarket", "Dilorom", "Non va sut", "Tayyor ovqat", "Kafe/restoran", "Boshqa"],
    "🏠 Uy": ["Uy jihozlari", "Ta'mirlash", "Xo'jalik mollari", "Mebel", "Boshqa"],
    [CAT.FAMILY]: fam,
    "💡 Kommunal": ["Elektr", "Gaz", "Suv", "Chiqindi", "Isitish", "Boshqa"],
    "👤 O'zim": ["Shaxsiy", "Kiyim", "Sog'liq", "Boshqa"],
    "💼 Ish": ["Yo'l", "Ish jihozlari", "Boshqa"],
    "📱 Aloqa": ["Telefon", "Internet", "Boshqa"],
    "💻 Texnika": ["Telefon/kompyuter", "Aksessuar", "Ta'mirlash", "Boshqa"],
    [CAT.CAR]: cars,
    "📅 Doimiy (oylik)": ["Kredit", "Ijara", "Obunalar", "Bog'cha/maktab", "Boshqa"],
    "📌 Boshqa": ["Do'stlar uchun", "Transport/taksi", "Xayriya", "Sovg'a", "Kutilmagan", "Boshqa"],
    [CAT.BIZ]: biz
  };
  return {
    [CAT.CAR]: cars,
    [CAT.BIZ]: biz,
    "💰 Boshqa tushumlar": ["Ish haqi", "Qo'shimcha ish", "Sovg'a", "Qarz qaytarildi", "Boshqa"]
  };
}
function resolve(kind, path) {
  let n = tree(kind);
  for (let i = 0; i < path.length; i++) {
    if (Array.isArray(n)) return (i === path.length - 1 && n.includes(path[i])) ? { leaf: true, parent: n } : null;
    n = n[path[i]];
    if (n === undefined) return null;
  }
  return { node: n };
}

const accById = id => cfg.accounts.find(a => a.id === id);
const accName = id => (accById(id) || {}).name || "?";
const money = (a, cur) => cur === "USD" ? "$" + fmtN(a) : fmt(a);
const toUzs = (a, cur) => cur === "USD" ? a * (+cfg.rate || 0) : a;
const uzsOf = e => e.cur === "USD" ? e.a * (+e.r || +cfg.rate || 0) : e.a;
const mkOf = (y, m) => `${y}_${pad(m)}`;
const allEntries = () => Object.values(DB).flat();
function totals(E) {
  let inc = 0, exp = 0;
  E.forEach(e => { if (e.k === "o" || e.c === CAT.BIZ) return; e.k === "t" ? inc += uzsOf(e) : exp += uzsOf(e); });
  return { inc, exp };
}
const isDebt = id => { const a = accById(id); return !!(a && a.type === "debt"); };
const debtPayUzs = E => E.reduce((s, e) => s + (e.k === "o" && isDebt(e.to) && !isDebt(e.acc) ? uzsOf(e) : 0), 0);
function dueList() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth() + 1, day = now.getDate();
  const mk = mkOf(y, m), b = balances(), out = [];
  for (const a of cfg.accounts) {
    if (a.type !== "debt" || !a.monthly || !a.day) continue;
    if (-(b[a.id] || 0) <= 0.001) continue;
    if (a.start && mk < a.start.replace("-", "_")) continue;
    const paid = (DB[mk] || []).filter(e => e.k === "o" && e.to === a.id).reduce((s, e) => s + (e.a2 ?? e.a), 0);
    if (paid >= a.monthly - 0.001) continue;
    out.push({ a, late: day > a.day, left: +(a.monthly - paid).toFixed(2), date: `${a.day}-${MONTHS[m - 1].toLowerCase()}` });
  }
  return out;
}
function stock(biz) {
  const P = {};
  for (const e of allEntries()) {
    if (!e.item || e.k === "o" || e.c !== CAT.BIZ || e.b !== biz) continue;
    const p = P[e.item] || (P[e.item] = { inQ: 0, outQ: 0, cost: 0 });
    if (e.k === "x" && (e.s === ITEM_IN || e.s === ITEM_OPEN)) { p.inQ += +e.q || 0; p.cost += uzsOf(e); }
    else if (e.k === "x" && e.s === ITEM_CARGO) p.cost += uzsOf(e);
    else if (e.q) p.outQ += +e.q;
  }
  for (const p of Object.values(P)) { p.avg = p.inQ ? p.cost / p.inQ : 0; p.left = +(p.inQ - p.outQ).toFixed(3); p.value = p.avg * p.left; }
  return P;
}
const stockValue = biz => Object.values(stock(biz)).reduce((s, p) => s + Math.max(0, p.value), 0);
function balances() {
  const b = {}; cfg.accounts.forEach(a => b[a.id] = +a.open || 0);
  for (const e of allEntries()) {
    if (e.k === "x" && e.acc in b) b[e.acc] -= e.a;
    else if (e.k === "t" && e.acc in b) b[e.acc] += e.a;
    else if (e.k === "o") {
      if (e.acc in b) b[e.acc] -= e.a;
      if (e.to in b) b[e.to] += (e.a2 ?? e.a);
    }
  }
  return b;
}

function bars(map, cls) {
  const arr = Object.entries(map).sort((a, b) => b[1] - a[1]);
  const max = arr.length ? arr[0][1] : 1;
  return arr.map(([k, v]) => `<div class="bar"><div class="bl"><span>${esc(k)}</span><b>${fmt(v)}</b></div><div class="track"><i class="${cls}" style="width:${Math.max(2, v / max * 100)}%"></i></div></div>`).join("");
}
function dbars(groups, cls, subOf) {
  const arr = Object.entries(groups).map(([k, L]) => [k, L, L.reduce((s, e) => s + uzsOf(e), 0)]).sort((a, b) => b[2] - a[2]);
  const max = arr.length ? arr[0][2] || 1 : 1;
  return arr.map(([k, L, v]) => {
    const subs = {}; L.forEach(e => { const sk = subOf(e); subs[sk] = (subs[sk] || 0) + uzsOf(e); });
    const subHtml = Object.entries(subs).sort((a, b) => b[1] - a[1]).map(([sk, sv]) => `<div class="kv sub"><span>${esc(sk)}</span><b>${fmt(sv)}</b></div>`).join("");
    const items = [...L].sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0).map(e =>
      `<div class="it"><span>${e.d.slice(8)}.${e.d.slice(5, 7)} ${esc(entryTitle(e))}${e.n ? ` — <i>${esc(e.n)}</i>` : ""}</span><b>${money(e.a, e.cur)}</b></div>`).join("");
    return `<details class="bar"><summary><div class="bl"><span>${esc(k)}</span><b>${fmt(v)}<span class="arr">›</span></b></div><div class="track"><i class="${cls}" style="width:${Math.max(2, v / max * 100)}%"></i></div></summary><div class="det">${subHtml}<div class="its">${items}</div></div></details>`;
  }).join("");
}

function carPL(E, car) {
  const inc = {}, opx = {}, one = {}; let pay = 0, any = false;
  for (const e of E) {
    if (e.k !== "o" && e.c === CAT.CAR && e.b === car) {
      any = true; const v = uzsOf(e);
      const m = e.k === "t" ? inc : ONE_TIME.has(e.s) ? one : opx; m[e.s] = (m[e.s] || 0) + v;
    }
    if (e.k === "o") { const d = accById(e.to); if (d && d.type === "debt" && d.car === car && !isDebt(e.acc)) { pay += uzsOf(e); any = true; } }
  }
  if (!any) return "";
  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  const subs = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="kv sub"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join("");
  const I = sum(inc), X = sum(opx), O = sum(one), op = I - X, net = op - O - pay;
  const debt = cfg.accounts.find(a => a.type === "debt" && a.car === car);
  let owe = "";
  if (debt) { const b = balances()[debt.id] || 0; owe = `<div class="kv sub"><span>Nasiya qoldig'i</span><b>${money(Math.max(0, -b), debt.cur)}</b></div>`; }
  return `<section class="card pl"><h2>🚗 ${esc(car)}: foyda va zarar</h2>
    <div class="kv"><span>Tushum</span><b class="inc">${fmt(I)}</b></div>${subs(inc)}
    <div class="gap"></div>
    <div class="kv"><span>Ish xarajatlari</span><b class="exp">${fmt(X)}</b></div>${subs(opx)}
    <div class="kv total"><span>Operatsion foyda</span><b class="${op < 0 ? "exp" : "inc"}">${sfmt(op)}</b></div>
    ${O ? `<div class="kv"><span>Bir martalik / davriy xarajatlar</span><b class="exp">${fmt(O)}</b></div>${subs(one)}` : ""}
    ${pay || debt ? `<div class="kv"><span>Nasiya to'lovi</span><b class="exp">${fmt(pay)}</b></div>${owe}` : ""}
    <div class="kv total"><span>Qo'lga qolgan pul</span><b class="${net < 0 ? "exp" : "inc"}">${sfmt(net)}</b></div>
    <p class="hint" style="margin:8px 0 0">Operatsion foyda: mashinaning kundalik ishi o'zini oqlayaptimi. Qo'lga qolgan pul: litsenziya, sug'urta va nasiya to'lovidan keyin nima qolgani.</p></section>`;
}
function bizPL(E, biz) {
  const S = stock(biz); let rev = 0, cogs = 0, buy = 0, own = 0, openV = 0, any = false; const opx = {}, sales = {};
  for (const e of E) {
    if (e.k === "o" || e.c !== CAT.BIZ || e.b !== biz) continue;
    any = true; const v = uzsOf(e);
    if (e.k === "t") {
      rev += v;
      if (e.item) { sales[e.item] = (sales[e.item] || 0) + v; if (e.q && S[e.item]) cogs += S[e.item].avg * e.q; }
    } else if (e.s === ITEM_OPEN) openV += v;
    else if (e.s === ITEM_IN || e.s === ITEM_CARGO) buy += v;
    else if (e.s === ITEM_OWN) own += (e.item && S[e.item] && e.q) ? S[e.item].avg * e.q : v;
    else opx[e.s] = (opx[e.s] || 0) + v;
  }
  const rows = Object.entries(S).filter(([, p]) => p.inQ || p.outQ);
  if (!any && !rows.length) return "";
  const X = Object.values(opx).reduce((a, b) => a + b, 0), gp = rev - cogs, np = gp - X;
  const sub = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="kv sub"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join("");
  let total = 0;
  const stockTbl = rows.map(([k, p]) => { total += Math.max(0, p.value); return `<tr><td>${esc(k)}</td><td>${fmtN(p.left)}</td><td>${fmt(p.avg)}</td><td>${fmt(Math.max(0, p.value))}</td></tr>`; }).join("");
  return `<section class="card pl"><h2>📦 ${esc(biz)}: foyda va zarar</h2>
    <div class="kv"><span>Sotuv tushumi</span><b class="inc">${fmt(rev)}</b></div>${sub(sales)}
    <div class="kv"><span>Sotilgan tovar tannarxi</span><b class="exp">${fmt(cogs)}</b></div>
    <div class="kv total"><span>Yalpi foyda</span><b class="${gp < 0 ? "exp" : "inc"}">${sfmt(gp)}</b></div>
    ${X ? `<div class="kv"><span>Biznes xarajatlari</span><b class="exp">${fmt(X)}</b></div>${sub(opx)}` : ""}
    <div class="kv total"><span>Sof foyda</span><b class="${np < 0 ? "exp" : "inc"}">${sfmt(np)}</b></div>
    ${buy ? `<div class="kv sub"><span>Omborga tovar olindi (xarajat emas)</span><b>${fmt(buy)}</b></div>` : ""}

  if (a === "quick") return applyQuick();
});
document.addEventListener("input", ev => {
  if (ev.target.id === "amt") { syncAmt(); updateSave(); }
  if (ev.target.id === "itemNew") { draft.item = ev.target.value.trim(); $$("#itemChips .chip").forEach(c => c.classList.toggle("on", c.dataset.item === draft.item)); renderItem(); updateSave(); }
  if (ev.target.id === "qty") { draft.q = parseNum(ev.target.value); renderItem(); updateSave(); }
  if (ev.target.id === "amt2") {
    const t = accById(draft.to);
    draft.a2s = cleanNum(ev.target.value, true);
    ev.target.value = draft.a2s; updateSave();
  }
});
document.addEventListener("change", ev => {
  if (ev.target.classList.contains("at")) {
    const row = ev.target.closest(".arow"), debt = ev.target.value === "debt";
    row.querySelector(".ext").hidden = !debt;
    row.querySelector(".ao").placeholder = debt ? "Qarz qoldig'i" : "Boshl. qoldiq";
    return;
  }
  if (ev.target.id !== "impFile" || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { $("#imp").value = r.result; toast("Fayl o'qildi. Endi \"Import qilish\" ni bosing."); };
  r.readAsText(ev.target.files[0]);
});
$("#amt").addEventListener("keydown", ev => { if (ev.key === "Enter") ev.target.blur(); });
$("#quick").addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); applyQuick(); } });
if (ver("6.1")) tg.BackButton.onClick(() => show("home"));

(async () => {
  const now = new Date();
  view = { y: now.getFullYear(), m: now.getMonth() + 1 };
  try { await load(); }
  catch (e) { $("#loading").textContent = "Ma'lumotlarni yuklab bo'lmadi. Ilovani yopib, qayta oching."; return; }
  $("#loading").remove();
  show("home");
})();
</script>
</body>
