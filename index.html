<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hisob-kitob</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #eff1f4);
  --text: var(--tg-theme-text-color, #15171b);
  --hint: var(--tg-theme-hint-color, #858b95);
  --accent: var(--tg-theme-button-color, #2d7fe0);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --line: rgba(128,128,128,.2);
  --exp: #d4433b;
  --inc: #1c9a55;
  --tr: #6a6fd1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tg]){ --bg:#1b1d22; --bg2:#121316; --text:#eceef2; --hint:#8b909a; --accent:#5b9cf0; --exp:#ef6a62; --inc:#3fc27c; --tr:#9a9ef0; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2);color:var(--text)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 96px}
[hidden]{display:none!important}
.bal,.sum,td,.bar b,.kv b,#amt,#amt2{font-variant-numeric:tabular-nums}

.card{background:var(--bg);border-radius:14px;padding:14px 16px;margin-bottom:10px}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
.empty{color:var(--hint);text-align:center;margin:18px 8px}
.hint{color:var(--hint);font-size:13px;margin:8px 4px}
.lbl{color:var(--hint);font-size:13px}

.month{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.month h1{font-size:17px;font-weight:600;margin:0}
.mnav{width:40px;height:36px;border-radius:10px;font-size:22px;color:var(--accent)}

.summary{padding:18px 16px 14px}
.bal{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 12px}
.bal.neg{color:var(--exp)}
.split{display:flex;gap:10px}
.split div{flex:1;background:var(--bg2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--hint)}
.split b{display:block;font-size:16px;color:var(--text)}
.split .inc b{color:var(--inc)} .split .exp b{color:var(--exp)}

.actions{display:flex;gap:8px;margin-bottom:10px}
.big{flex:1;height:52px;border-radius:14px;font-weight:600;font-size:15px}
.big.exp,.big.inc,.big.tr{color:#fff}
.big.exp{background:var(--exp)} .big.inc{background:var(--inc)} .big.tr{background:var(--tr);flex:.7}

.list{padding:6px 0}
.list h3{font-size:13px;font-weight:500;color:var(--hint);margin:12px 16px 4px}
.row{display:flex;width:100%;align-items:center;gap:10px;padding:9px 16px;text-align:left}
.row:active{background:var(--bg2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--hint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{font-weight:600;white-space:nowrap}
.inc{color:var(--inc)} .exp{color:var(--exp)} .tr{color:var(--tr)}

/* qo'shish */
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;color:var(--hint)}
#add[data-kind="x"] .seg button[data-kind="x"]{background:var(--exp);color:#fff}
#add[data-kind="t"] .seg button[data-kind="t"]{background:var(--inc);color:#fff}
#add[data-kind="o"] .seg button[data-kind="o"]{background:var(--tr);color:#fff}
.amount{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0 10px}
#amt{width:100%;border:0;background:transparent;text-align:center;font-size:46px;font-weight:700;letter-spacing:-1px;padding:0;outline:none;caret-color:var(--accent)}
#add[data-kind="x"] #amt{color:var(--exp)} #add[data-kind="t"] #amt{color:var(--inc)} #add[data-kind="o"] #amt{color:var(--tr)}
#amt::placeholder{color:var(--line)}
#curBtn{color:var(--accent);font-size:15px;font-weight:600;padding:4px 12px;border-radius:14px;background:var(--bg)}
#curBtn:disabled{color:var(--hint);background:none}
.lab{font-size:13px;color:var(--hint);margin:6px 4px 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--bg);border-radius:18px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-text)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 2px 8px;font-size:14px}
.crumbs button{color:var(--accent);padding:4px 2px}
.crumbs button:last-child{color:var(--text);font-weight:600}
.crumbs span{color:var(--hint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cell{background:var(--bg);border-radius:12px;padding:12px;min-height:50px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px}
.cell i{font-style:normal;color:var(--hint)}
.cell.on{background:var(--accent);color:var(--accent-text)}
.grid .empty{grid-column:1/-1}
.fields{padding:4px 16px}
.fields input{width:100%;border:0;background:transparent;padding:12px 0;outline:none}
.fields input+input,.fields .chips+input{border-top:1px solid var(--line)}
.danger{width:100%;height:44px;border-radius:14px;background:none;color:var(--exp);font-weight:500;margin-top:6px}
.primary{width:100%;height:50px;border-radius:14px;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:16px}
.primary:disabled{opacity:.45}
.secondary{width:100%;height:46px;border-radius:14px;background:var(--bg);color:var(--accent);font-weight:600;margin-bottom:6px}

/* hisobot */
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.kv span{color:var(--hint)}
.kv.total{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.kv.total b{font-size:18px}
.bar{margin:0 0 10px}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
.bl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}
.track i.exp{background:var(--exp)} .track i.inc{background:var(--inc)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--hint);font-weight:500;text-align:right;padding:4px 0 6px 8px}
td{text-align:right;padding:7px 0 7px 8px;border-top:1px solid var(--line);white-space:nowrap}
td:first-child,th:first-child{text-align:left;padding-left:0;white-space:normal}

/* hisoblar */
.acc{padding:11px 16px;border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc .top{display:flex;justify-content:space-between;gap:10px}
.acc .top b{font-weight:600;white-space:nowrap}
.acc .top b.neg{color:var(--exp)}
.acc small{color:var(--hint);font-size:12.5px;display:block}
.inv{display:flex;gap:6px;margin-top:8px}
.inv input{flex:1;min-width:0;border:0;border-radius:9px;background:var(--bg2);padding:8px 10px;outline:none}
.inv button{padding:0 12px;border-radius:9px;background:var(--bg2);color:var(--accent);font-weight:600}

/* sozlamalar */
.irow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.irow input{flex:1;border:0;background:transparent;padding:11px 0;outline:none}
.irow button,.arow button{width:36px;height:36px;color:var(--hint);font-size:15px}
.arow{display:grid;grid-template-columns:.8fr 1fr 1.3fr 36px;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.arow .an{grid-column:1/-1}
.arow input,.arow select,.rate input,textarea{border:0;border-radius:9px;background:var(--bg2);padding:9px 10px;outline:none;min-width:0;width:100%}
.rate{display:flex;align-items:center;gap:10px}
.rate span{white-space:nowrap}
textarea{min-height:110px;resize:vertical;font-size:13px;margin-bottom:8px}
.link{color:var(--accent);padding:12px 0 4px;font-weight:500}
.filebtn{display:inline-block;color:var(--accent);font-weight:500;margin:0 0 10px;cursor:pointer}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;max-width:140px;height:54px;font-size:13px;color:var(--hint);font-weight:500}
.tabs button.on{color:var(--accent);font-weight:600}

.due{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:14px;padding:12px 16px;margin-bottom:10px;border-left:4px solid var(--tr)}
.due.late{border-left-color:var(--exp)}
.due small{display:block;color:var(--hint);font-size:12.5px}
.due button{background:var(--accent);color:var(--accent-text);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.arow .ext{grid-column:1/-1;display:grid;grid-template-columns:1fr .5fr 1fr;gap:6px}
.arow .ext input[type=month]{grid-column:1/-1}
.sec{font-size:13px;color:var(--hint);margin:10px 16px 2px}
.pl .kv{padding:4px 0;font-size:14.5px}
.pl .kv.sub{font-size:13.5px;padding:2px 0}
.pl .kv.sub span{padding-left:14px}
.pl .kv.sub b{font-weight:500;color:var(--hint)}
.pl .gap{height:8px}
details.bar summary{list-style:none;cursor:pointer}
details.bar .bl{align-items:center}
details.bar .bl b{display:flex;align-items:center;white-space:nowrap}
details.bar summary::-webkit-details-marker{display:none}
details.bar .bl .arr{display:inline-block;color:var(--hint);margin-left:6px;transition:transform .15s;overflow:visible}
details.bar[open] .bl .arr{transform:rotate(90deg)}
details.bar .det{margin:8px 0 4px;padding:8px 10px;background:var(--bg2);border-radius:10px}
details.bar .det .kv.sub{font-size:13.5px;padding:2px 0}
details.bar .det .kv.sub b{font-weight:600}
.its{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.it{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;color:var(--hint)}
.it span{min-width:0}
.it i{font-style:normal;opacity:.8}
.it b{font-weight:500;color:var(--text);white-space:nowrap}
.quick{display:flex;gap:8px;background:var(--bg);border-radius:14px;padding:6px 6px 6px 14px;margin-bottom:6px;align-items:center}
.quick input{flex:1;border:0;background:transparent;outline:none;padding:8px 0;min-width:0}
.quick button{width:42px;height:42px;border-radius:11px;background:var(--accent);color:var(--accent-text);font-size:18px;flex:none}
.qhint{color:var(--hint);font-size:12px;margin:0 6px 10px}
:root[data-preset="ayol"]{--accent:#d65a8e;--accent-text:#ffffff;--tr:#9a6fd8}
:root[data-preset="ayol"] .summary{background:linear-gradient(135deg,rgba(214,90,142,.16),rgba(154,111,216,.10)),var(--bg)}
:root[data-preset="ayol"] .big.exp{background:#d9607a} :root[data-preset="ayol"] .big.inc{background:#3aa77a}
.track i.warn{background:#e0a030}
.lim{margin-bottom:12px}
.lim .bl b small{color:var(--hint);font-weight:400}
.lhint{display:block;color:var(--hint);font-size:12px;margin-top:3px}
.due.low{border-left-color:#e0a030}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tile{background:var(--bg2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--hint)}
.tile b{display:block;font-size:15px;color:var(--text);margin-top:2px}
.limin{width:130px;text-align:right;border:0;border-radius:9px;background:var(--bg2);padding:8px 10px}
.gtitle{display:flex;justify-content:space-between;align-items:center}
.gtitle h2{margin:0 0 8px}
.gdel{color:var(--hint);width:32px;height:32px}
.gnext{background:var(--bg2);border-radius:12px;padding:12px 14px;margin-bottom:10px;line-height:1.5}
.gnext.me{background:linear-gradient(135deg,rgba(214,90,142,.18),rgba(154,111,216,.14))}
.gtl summary{cursor:pointer;color:var(--accent);font-weight:500;padding:4px 0}
.grow{display:grid;grid-template-columns:1.1fr 1.4fr 28px;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.grow.me{font-weight:600}
.grow b{text-align:right}
.gform input,.gform select,.gform textarea{width:100%;border:0;border-radius:9px;background:var(--bg2);padding:10px;margin-bottom:8px;outline:none}
.gform .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lock{text-align:center}
.lock h2{margin-bottom:6px}
.pstat{background:var(--bg2);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-weight:600}
.pstat small{display:block;font-weight:400;color:var(--hint);margin-top:2px}
.onb{padding:8px 4px 20px}
.onb .dots{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}
.onb .dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.onb .dots i.on{background:var(--accent);width:22px}
.onb .hero{font-size:44px;text-align:center;margin:8px 0 4px}
.onb h1{font-size:22px;text-align:center;margin:0 0 6px}
.onb .sub{text-align:center;color:var(--hint);margin:0 0 18px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:2px solid transparent}
.opt b{display:block;font-size:16px}
.opt small{color:var(--hint)}
.opt.on{border-color:var(--accent)}
.onb .chips{flex-wrap:wrap;overflow:visible}
.obal{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.obal span{flex:1}
.obal input{width:140px;text-align:right;border:0;border-radius:9px;background:var(--bg2);padding:9px 10px;outline:none}
.oin{width:100%;border:0;border-radius:12px;background:var(--bg);padding:12px 14px;outline:none;margin-bottom:10px}
.tip{display:flex;gap:12px;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:8px;align-items:flex-start}
.tip b{font-size:20px;line-height:1.2}
.onb .row2{display:flex;gap:8px;margin-top:6px}
.onb .row2 button{flex:1}
.art{text-align:left;border-radius:20px;padding:18px 16px;margin:0 0 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--bg)),color-mix(in srgb,var(--tr) 16%,var(--bg)));min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:8px}
@supports not (background:color-mix(in srgb,red 10%,blue)){.art{background:var(--bg)}}
.mk{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;justify-content:space-between;gap:8px;align-items:center}
.mk small{color:var(--hint)}
.mk.pill{border-radius:22px;justify-content:flex-start}
.mk.me{border:2px solid var(--accent)}
.mk.warn{border-left:4px solid #e0a030}
.mk .bar2{flex:1;height:7px;border-radius:4px;background:var(--bg2);overflow:hidden}
.mk .bar2 i{display:block;height:100%;border-radius:4px}
.arrow{text-align:center;color:var(--hint);font-size:18px;line-height:1}
.bub{background:var(--bg);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13.5px;max-width:88%;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.pbadge{display:inline-block;background:linear-gradient(135deg,#f5b642,#e07b39);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;margin:0 auto 8px}
.slide{text-align:center}
.slide h1{margin-top:2px}
.feat{list-style:none;padding:0;margin:0 0 14px;text-align:left}
.feat li{background:var(--bg);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:14px}
.sdots{display:flex;gap:5px;justify-content:center;margin:0 0 12px}
.sdots i{width:6px;height:6px;border-radius:3px;background:var(--line)}
.sdots i.on{background:var(--accent)}
.trialbox{background:linear-gradient(135deg,rgba(245,182,66,.18),rgba(224,123,57,.14));border-radius:14px;padding:14px;margin:4px 0 12px;font-size:14px;line-height:1.5}
.gm{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.gm .st{min-width:92px;text-align:center;border-radius:10px;padding:6px 8px;font-size:13px;font-weight:600;background:var(--bg2)}
.gm .st.ok{background:rgba(28,154,85,.14);color:var(--inc)}
.gm .st.wait{color:var(--hint)}
.gm button.st{cursor:pointer}
.gm small{color:var(--hint)}
.gtools{display:flex;gap:8px;margin-top:10px}
.gtools button{flex:1}
.gbadge{font-size:11px;background:var(--bg2);color:var(--hint);padding:2px 8px;border-radius:10px;margin-left:6px;font-weight:500}
.ptop{text-align:center;padding:6px 0 4px}
.plogo{width:64px;height:64px;border-radius:20px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:32px;background:linear-gradient(135deg,#f5b642,#e07b39);box-shadow:0 6px 18px rgba(224,123,57,.35)}
.ptop h1{font-size:21px;margin:0 0 4px}
.pfeat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.pfeat div{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.pfeat b{font-size:18px}
.rcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;transition:border-color .15s,background .15s}
.rcard.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--bg))}
.rcard:disabled{opacity:.4}
.rdot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.rcard.on .rdot{border-color:var(--accent)}
.rcard.on .rdot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.rbody{flex:1;min-width:0}
.rbody b{display:block;font-size:15px}
.rbody small{color:var(--hint);font-size:12.5px}
.rbody .save{color:var(--inc);font-weight:600;margin-left:6px}
.rprice{font-weight:700;white-space:nowrap;font-size:15px}
.rprice s{display:block;color:var(--hint);font-weight:400;font-size:12px;text-align:right}
.hit{position:relative}
.hit::before{content:attr(data-badge);position:absolute;top:-9px;right:14px;background:linear-gradient(135deg,#f5b642,#e07b39);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mrow .rcard{flex-direction:column;align-items:flex-start;gap:6px;margin:0}
.mrow .mtop{display:flex;gap:10px;align-items:center;width:100%}
.cardpills{display:flex;gap:4px;flex-wrap:wrap}
.cardpills span{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2px 6px;border-radius:5px;background:var(--bg2);color:var(--hint)}
.ptotal{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:14px 16px;margin:12px 0 8px;font-size:15px}
.ptotal b{font-size:19px}
.psteps{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:var(--hint);margin-bottom:10px}
.pfoot{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg2) 22%)}
.trust{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--hint);margin-bottom:8px}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;height:58px;padding:0 2px}
.tabs button i{font-style:normal;font-size:19px;line-height:1;filter:grayscale(1);opacity:.55}
.tabs button.on i{filter:none;opacity:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--bg);border-radius:14px;padding:12px 14px}
.kpi small{display:block;color:var(--hint);font-size:12.5px}
.kpi b{display:block;font-size:19px;margin:2px 0}
.kpi em{font-style:normal;font-size:12px;font-weight:600}
.up{color:var(--inc)} .down{color:var(--exp)}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donutwrap{display:flex;align-items:center;gap:14px}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--hint)}
.topx{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.topx span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topx small{color:var(--hint)}
.ibx{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ibx b{font-weight:500;display:block}
.ibx small{color:var(--hint);font-size:12px}
.ibx button{padding:7px 12px;border-radius:10px;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:13px}
.ibx button.x{background:var(--bg2);color:var(--hint)}
:root:not([data-preset="ayol"]){--accent:#16a870;--accent-text:#ffffff}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.04)}
h2{font-size:16px;font-weight:700;letter-spacing:-.1px}
button{transition:transform .08s ease,opacity .15s}
button:active{transform:scale(.98)}
:root:not([data-preset="ayol"]) .summary{background:linear-gradient(135deg,rgba(22,168,112,.16),rgba(22,168,112,.03)),var(--bg)}
.big{border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.row{gap:12px}
.ic{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px}
.acc .top span{display:flex;align-items:center;gap:10px}
.acc .ic{width:34px;height:34px;border-radius:10px;font-size:17px;background:var(--bg2)}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding:70px 20px;color:var(--hint)}
.brand img{width:96px;height:96px;border-radius:50%;box-shadow:0 8px 28px rgba(22,168,112,.35);animation:pulse 1.6s ease-in-out infinite}
.brand b{font-size:22px;color:var(--text);letter-spacing:-.3px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){.brand img{animation:none}}
.onb .logo{width:84px;height:84px;border-radius:50%;display:block;margin:6px auto 10px;box-shadow:0 8px 26px rgba(22,168,112,.35)}
.langs{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.langs button{padding:7px 12px;border-radius:18px;background:var(--bg);font-size:13.5px;font-weight:600;color:var(--hint)}
.langs button.on{background:var(--accent);color:var(--accent-text)}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--hint);font-size:12.5px;margin:18px 0 6px}
.foot img{width:22px;height:22px;border-radius:50%}
.tcode{font-size:23px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--bg2);border-radius:12px;padding:14px;margin:4px 0 8px;font-family:ui-monospace,Menlo,Consolas,monospace;user-select:all}
.trow{display:flex;gap:8px;margin-top:8px}
.trow input{flex:1;min-width:0;border:0;border-radius:10px;background:var(--bg2);padding:10px 12px;outline:none;text-transform:uppercase;letter-spacing:1px}
.trow button{width:auto;padding:0 16px;margin:0}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:rgba(20,20,24,.9);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{text-align:center;color:var(--hint);padding:60px 20px}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>

<script>
const LOGO = document.querySelector("#loading img").src;
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const ver = v => inTg && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
if (inTg) {
  document.documentElement.dataset.tg = "1";
  tg.ready(); tg.expand();
  try { if (ver("6.1")) { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } } catch (e) {}
  try { if (ver("7.7")) tg.disableVerticalSwipes(); } catch (e) {}
}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const fmt = n => grp(String(Math.round(Math.abs(n))));
const fmtN = n => { const x = Math.abs(n); const s = Number.isInteger(x) ? String(x) : x.toFixed(2); const [i, f] = s.split("."); return grp(i) + (f ? "," + f : ""); };
const sfmt = n => (n < 0 ? "−" : "") + fmt(n);
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const parseNum = s => +(String(s ?? "").replace(/[\s\u00a0]/g, "").replace(",", ".").replace(/[^\d.]/g, "")) || 0;
const MONTHS = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentyabr","Oktyabr","Noyabr","Dekabr"];

function haptic(type) {
  try { if (ver("6.1")) type === "select" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
}
let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}
function ask(msg) {
  msg = typeof tr === "function" ? tr(msg) : msg;
  return new Promise(res => { if (ver("6.2")) tg.showConfirm(msg, ok => res(!!ok)); else res(confirm(msg)); });
}

/* ================= SAQLASH ================= */
const store = (() => {
  const cloud = ver("6.9") && tg.CloudStorage;
  const mem = {};
  const lsGet = k => { try { return localStorage.getItem("hk_" + k); } catch (e) { return mem[k] ?? null; } };
  const lsSet = (k, v) => { try { localStorage.setItem("hk_" + k, v); } catch (e) { mem[k] = v; } };
  const lsDel = k => { try { localStorage.removeItem("hk_" + k); } catch (e) { delete mem[k]; } };
  const call = (fn, ...a) => new Promise((res, rej) => fn.call(tg.CloudStorage, ...a, (err, val) => err ? rej(err) : res(val)));
  return {
    mode: cloud ? "cloud" : "local",
    async get(keys) {
      const out = {};
      for (let i = 0; i < keys.length; i += 20) {
        const part = keys.slice(i, i + 20);
        if (cloud) Object.assign(out, await call(tg.CloudStorage.getItems, part));
        else part.forEach(k => out[k] = lsGet(k));
      }
      return out;
    },
    async set(k, v) { if (cloud) return call(tg.CloudStorage.setItem, k, v); lsSet(k, v); },
    async del(keys) { if (!keys.length) return; if (cloud) return call(tg.CloudStorage.removeItems, keys); keys.forEach(lsDel); }
  };
})();

const DEF_ACCOUNTS = [
  { id: "naqd", name: "Naqd so'm", cur: "UZS", type: "cash", open: 0 },
  { id: "karta", name: "Karta", cur: "UZS", type: "card", open: 0 }
];
let cfg = { family: [], cars: [], biz: [], accounts: DEF_ACCOUNTS, rate: 12500, lastAcc: "" };
let idx = {}, DB = {};
const broken = new Set();
let queue = Promise.resolve();
const enqueue = fn => (queue = queue.catch(() => {}).then(fn));
const saveCfgStore = () => enqueue(() => store.set("cfg", JSON.stringify(cfg)));

function splitSafe(s, n) {
  const out = []; let i = 0;
  while (i < s.length) {
    let j = Math.min(i + n, s.length);
    if (j < s.length) { const c = s.charCodeAt(j - 1); if (c >= 0xD800 && c <= 0xDBFF) j--; }
    out.push(s.slice(i, j)); i = j;
  }
  return out;
}
async function load() {
  const base = await store.get(["cfg", "idx"]);
  if (base.cfg) try { cfg = Object.assign({}, cfg, JSON.parse(base.cfg)); } catch (e) {}
  if (base.idx) try { idx = JSON.parse(base.idx); } catch (e) {}
  const keys = [];
  for (const [mk, n] of Object.entries(idx)) for (let i = 0; i < n; i++) keys.push(`m${mk}_${i}`);
  const vals = await store.get(keys);
  for (const [mk, n] of Object.entries(idx)) {
    let s = ""; for (let i = 0; i < n; i++) s += vals[`m${mk}_${i}`] || "";
    try { DB[mk] = JSON.parse(s).map(fixLegacy); } catch (e) { DB[mk] = []; broken.add(mk); }
  }
}
async function saveMonth(mk) {
  const arr = DB[mk] || [];
  const parts = arr.length ? splitSafe(JSON.stringify(arr), 3500) : [];
  await Promise.all(parts.map((p, i) => store.set(`m${mk}_${i}`, p)));
  const old = idx[mk] || 0;
  if (parts.length) idx[mk] = parts.length; else delete idx[mk];
  await store.set("idx", JSON.stringify(idx));
  const extra = []; for (let i = parts.length; i < old; i++) extra.push(`m${mk}_${i}`);
  await store.del(extra);
}

const applyTheme = () => {
  document.documentElement.dataset.preset = cfg.preset || "asosiy";
  const gt = document.querySelector('#tabs [data-tab="gap"]'); if (gt) gt.hidden = !(cfg.preset === "ayol" || (cfg.gaps || []).length || (typeof SHARED !== "undefined" && SHARED.length));
};
/* ================= KATEGORIYALAR ================= */
const CAT = { FAMILY: "👨‍👩‍👧 Oila", CAR: "🚗 Mashina", BIZ: "📦 Biznes" };
const FAM_ITEMS = ["Kiyim", "O'qish/kurs", "Dori-darmon", "Cho'ntak puli", "Ovqat/shirinlik", "Boshqa"];
const CAR_X = ["Yoqilg'i", "Ta'mir va ehtiyot qism", "Texnik xizmat", "Yuvish", "Jarima", "Park komissiyasi", "Litsenziya va ruxsatnoma", "Sug'urta", "Texosmotr", "Hujjatlar", "Boshqa"];
const CAR_T = ["Yandex Pro", "Shaxsiy yo'lovchi (naqd)", "Boshqa dostavka", "Bonus", "Boshqa"];
const ONE_TIME = new Set(["Litsenziya va ruxsatnoma", "Sug'urta", "Texosmotr", "Hujjatlar"]);
const LEGACY = { "Benzin": "Yoqilg'i", "Litsenziya": "Litsenziya va ruxsatnoma", "Yandex (taksi/dostavka)": "Yandex Pro", "Yandex dostavka": "Yandex Pro", "Yandex taksi": "Yandex Pro", "Ehtiyot qism": "Ta'mir va ehtiyot qism" };
const fixLegacy = e => { if (e.c === "🚗 Mashina" && LEGACY[e.s]) e.s = LEGACY[e.s]; return e; };
const ITEM_IN = "Tovar xaridi", ITEM_CARGO = "Kargo/tamojnya", ITEM_SALE = "Sotuv", ITEM_OWN = "Shaxsiy foydalanish", ITEM_OPEN = "Boshlang'ich qoldiq";

const BIZ_T = [ITEM_SALE, "Boshqa"];

const PRESETS = { asosiy: "Umumiy", ayol: "Ayollar uchun" };
function treeAyol(kind) {
  const KID = ["Kiyim-kechak", "Poyabzal", "Maktab/bog'cha", "O'quv qurollari", "To'garak/kurs", "O'yinchoq", "Dori-darmon", "Shirinlik/ovqat", "Cho'ntak puli", "Boshqa"];
  const fam = {}; cfg.family.forEach(n => fam[n] = KID);
  fam["Umumiy oila"] = ["Oilaviy sayr", "Sayohat", "Bayram", "Boshqa"];
  const biz = {}; cfg.biz.forEach(b => biz[b] = kind === "x" ? BIZ_X : BIZ_T);
  if (kind === "x") return {
    "🛒 Oziq-ovqat": ["Bozor", "Supermarket", "Non va sut", "Meva-sabzavot", "Shirinliklar", "Tayyor ovqat", "Boshqa"],
    "🏠 Uy-ro'zg'or": ["Xo'jalik mollari", "Tozalash vositalari", "Idish-tovoq", "Uy bezaklari", "Maishiy texnika", "Boshqa"],
    [CAT.FAMILY]: fam,
    "💄 O'zim": ["Kiyim", "Poyabzal", "Kosmetika", "Parvarish (soch, tirnoq)", "Salon", "Sog'liq/dori", "Sport/fitnes", "Kurs/o'qish", "Aksessuar", "Boshqa"],
    "🎁 Sovg'a va marosim": ["Gap (kafe)", "To'y", "Tug'ilgan kun", "Mehmondorchilik", "Hayit/bayram", "Boshqa"],
    "🚕 Transport": ["Taksi", "Jamoat transporti", "Boshqa"],
    "📱 Aloqa": ["Telefon", "Internet", "Obunalar", "Boshqa"],
    "💝 Xayriya": ["Sadaqa", "Boshqa"],
    [CAT.BIZ]: biz,
    "📌 Boshqa": ["Kutilmagan", "Boshqa"]
  };
  return {
    [CAT.BIZ]: biz,
    "💰 Boshqa tushumlar": ["Turmush o'rtog'imdan", "Oylik", "Sovg'a", "Qarz qaytarildi", "Boshqa"]
  };
}
function tree(kind) {
  const t = treeFull(kind);
  if (!isPremium()) delete t[CAT.BIZ];
  return t;
}
function treeFull(kind) {
  if (cfg.preset === "ayol") return treeAyol(kind);
  const fam = {}; cfg.family.forEach(n => fam[n] = FAM_ITEMS);
  fam["Umumiy oila"] = ["To'y-marosim", "Sovg'a", "Sayohat", "Bayram", "Boshqa"];
  const cars = {}, biz = {};
  cfg.cars.forEach(c => cars[c] = kind === "x" ? CAR_X : CAR_T);
  cfg.biz.forEach(b => biz[b] = kind === "x" ? BIZ_X : BIZ_T);
  if (kind === "x") return {
    "🛒 Oziq-ovqat": ["Bozor", "Supermarket", "Dilorom", "Non va sut", "Tayyor ovqat", "Kafe/restoran", "Boshqa"],
    "🏠 Uy": ["Uy jihozlari", "Ta'mirlash", "Xo'jalik mollari", "Mebel", "Boshqa"],
    [CAT.FAMILY]: fam,
    "💡 Kommunal": ["Elektr", "Gaz", "Suv", "Chiqindi", "Isitish", "Boshqa"],
    "👤 O'zim": ["Shaxsiy", "Kiyim", "Sog'liq", "Boshqa"],
    "💼 Ish": ["Yo'l", "Ish jihozlari", "Boshqa"],
    "📱 Aloqa": ["Telefon", "Internet", "Boshqa"],
    "💻 Texnika": ["Telefon/kompyuter", "Aksessuar", "Ta'mirlash", "Boshqa"],
    [CAT.CAR]: cars,
    "📅 Doimiy (oylik)": ["Kredit", "Ijara", "Obunalar", "Bog'cha/maktab", "Boshqa"],
    "📌 Boshqa": ["Do'stlar uchun", "Transport/taksi", "Xayriya", "Sovg'a", "Kutilmagan", "Boshqa"],
    [CAT.BIZ]: biz
  };
  return {
    [CAT.CAR]: cars,
    [CAT.BIZ]: biz,
    "💰 Boshqa tushumlar": ["Ish haqi", "Qo'shimcha ish", "Sovg'a", "Qarz qaytarildi", "Boshqa"]
  };
}
function resolve(kind, path) {
  let n = tree(kind);
  for (let i = 0; i < path.length; i++) {
    if (Array.isArray(n)) return (i === path.length - 1 && n.includes(path[i])) ? { leaf: true, parent: n } : null;
    n = n[path[i]];
    if (n === undefined) return null;
  }
  return { node: n };
}

/* ================= HISOB-KITOB ================= */
const accById = id => cfg.accounts.find(a => a.id === id);
const accName = id => (accById(id) || {}).name || "?";
const money = (a, cur) => cur === "USD" ? "$" + fmtN(a) : fmt(a);
const toUzs = (a, cur) => cur === "USD" ? a * (+cfg.rate || 0) : a;
const uzsOf = e => e.cur === "USD" ? e.a * (+e.r || +cfg.rate || 0) : e.a;
const mkOf = (y, m) => `${y}_${pad(m)}`;
const allEntries = () => Object.values(DB).flat();
function totals(E) {
  let inc = 0, exp = 0;
  E.forEach(e => { if (e.k === "o" || e.c === CAT.BIZ) return; e.k === "t" ? inc += uzsOf(e) : exp += uzsOf(e); });
  return { inc, exp };
}
const isDebt = id => { const a = accById(id); return !!(a && a.type === "debt"); };
const debtPayUzs = E => E.reduce((s, e) => s + (e.k === "o" && isDebt(e.to) && !isDebt(e.acc) ? uzsOf(e) : 0), 0);
function dueList() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth() + 1, day = now.getDate();
  const mk = mkOf(y, m), b = balances(), out = [];
  for (const a of cfg.accounts) {
    if (a.type !== "debt" || !a.monthly || !a.day) continue;
    if (-(b[a.id] || 0) <= 0.001) continue;
    if (a.start && mk < a.start.replace("-", "_")) continue;
    const paid = (DB[mk] || []).filter(e => e.k === "o" && e.to === a.id).reduce((s, e) => s + (e.a2 ?? e.a), 0);
    if (paid >= a.monthly - 0.001) continue;
    out.push({ a, late: day > a.day, left: +(a.monthly - paid).toFixed(2), date: `${a.day}-${MONTHS[m - 1].toLowerCase()}` });
  }
  return out;
}
function stock(biz) {
  const P = {};
  for (const e of allEntries()) {
    if (!e.item || e.k === "o" || e.c !== CAT.BIZ || e.b !== biz) continue;
    const p = P[e.item] || (P[e.item] = { inQ: 0, outQ: 0, cost: 0 });
    if (e.k === "x" && (e.s === ITEM_IN || e.s === ITEM_OPEN)) { p.inQ += +e.q || 0; p.cost += uzsOf(e); }
    else if (e.k === "x" && e.s === ITEM_CARGO) p.cost += uzsOf(e);
    else if (e.q) p.outQ += +e.q;
  }
  for (const p of Object.values(P)) { p.avg = p.inQ ? p.cost / p.inQ : 0; p.left = +(p.inQ - p.outQ).toFixed(3); p.value = p.avg * p.left; }
  return P;
}
const stockValue = biz => Object.values(stock(biz)).reduce((s, p) => s + Math.max(0, p.value), 0);
function balances() {
  const b = {}; cfg.accounts.forEach(a => b[a.id] = +a.open || 0);
  for (const e of allEntries()) {
    if (e.k === "x" && e.acc in b) b[e.acc] -= e.a;
    else if (e.k === "t" && e.acc in b) b[e.acc] += e.a;
    else if (e.k === "o") {
      if (e.acc in b) b[e.acc] -= e.a;
      if (e.to in b) b[e.to] += (e.a2 ?? e.a);
    }
  }
  return b;
}

function entryTitle(e) {

  return e.b ? `${e.s}, ${e.b}` : e.s;
}

function bars(map, cls) {
  const arr = Object.entries(map).sort((a, b) => b[1] - a[1]);
  const max = arr.length ? arr[0][1] : 1;
  return arr.map(([k, v]) => `<div class="bar"><div class="bl"><span>${esc(k)}</span><b>${fmt(v)}</b></div><div class="track"><i class="${cls}" style="width:${Math.max(2, v / max * 100)}%"></i></div></div>`).join("");
}
function dbars(groups, cls, subOf) {
  const arr = Object.entries(groups).map(([k, L]) => [k, L, L.reduce((s, e) => s + uzsOf(e), 0)]).sort((a, b) => b[2] - a[2]);
  const max = arr.length ? arr[0][2] || 1 : 1;
  return arr.map(([k, L, v]) => {
    const subs = {}; L.forEach(e => { const sk = subOf(e); subs[sk] = (subs[sk] || 0) + uzsOf(e); });
    const subHtml = Object.entries(subs).sort((a, b) => b[1] - a[1]).map(([sk, sv]) => `<div class="kv sub"><span>${esc(sk)}</span><b>${fmt(sv)}</b></div>`).join("");
    const items = [...L].sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0).map(e =>
      `<div class="it"><span>${e.d.slice(8)}.${e.d.slice(5, 7)} ${esc(entryTitle(e))}${e.n ? ` — <i>${esc(e.n)}</i>` : ""}</span><b>${money(e.a, e.cur)}</b></div>`).join("");
    return `<details class="bar"><summary><div class="bl"><span>${esc(k)}</span><b>${fmt(v)}<span class="arr">›</span></b></div><div class="track"><i class="${cls}" style="width:${Math.max(2, v / max * 100)}%"></i></div></summary><div class="det">${subHtml}<div class="its">${items}</div></div></details>`;
  }).join("");
}

  h += `<button class="secondary" data-act="export">Excel uchun nusxa olish</button>
    <p class="hint">Oyning barcha yozuvlari jadval ko'rinishida nusxalanadi. Excel'da bitta katakni tanlab, joylashtiring (Ctrl+V).</p>`;
  $("#report").innerHTML = h;

function carPL(E, car) {
  const inc = {}, opx = {}, one = {}; let pay = 0, any = false;
  for (const e of E) {
    if (e.k !== "o" && e.c === CAT.CAR && e.b === car) {
      any = true; const v = uzsOf(e);
      const m = e.k === "t" ? inc : ONE_TIME.has(e.s) ? one : opx; m[e.s] = (m[e.s] || 0) + v;
    }
    if (e.k === "o") { const d = accById(e.to); if (d && d.type === "debt" && d.car === car && !isDebt(e.acc)) { pay += uzsOf(e); any = true; } }
  }
  if (!any) return "";
  const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  const subs = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="kv sub"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join("");
  const I = sum(inc), X = sum(opx), O = sum(one), op = I - X, net = op - O - pay;
  const debt = cfg.accounts.find(a => a.type === "debt" && a.car === car);
  let owe = "";
  if (debt) { const b = balances()[debt.id] || 0; owe = `<div class="kv sub"><span>Nasiya qoldig'i</span><b>${money(Math.max(0, -b), debt.cur)}</b></div>`; }
  return `<section class="card pl"><h2>🚗 ${esc(car)}: foyda va zarar</h2>
    <div class="kv"><span>Tushum</span><b class="inc">${fmt(I)}</b></div>${subs(inc)}
    <div class="gap"></div>
    <div class="kv"><span>Ish xarajatlari</span><b class="exp">${fmt(X)}</b></div>${subs(opx)}
    <div class="kv total"><span>Operatsion foyda</span><b class="${op < 0 ? "exp" : "inc"}">${sfmt(op)}</b></div>
    ${O ? `<div class="kv"><span>Bir martalik / davriy xarajatlar</span><b class="exp">${fmt(O)}</b></div>${subs(one)}` : ""}
    ${pay || debt ? `<div class="kv"><span>Nasiya to'lovi</span><b class="exp">${fmt(pay)}</b></div>${owe}` : ""}
    <div class="kv total"><span>Qo'lga qolgan pul</span><b class="${net < 0 ? "exp" : "inc"}">${sfmt(net)}</b></div>
    <p class="hint" style="margin:8px 0 0">Operatsion foyda: mashinaning kundalik ishi o'zini oqlayaptimi. Qo'lga qolgan pul: litsenziya, sug'urta va nasiya to'lovidan keyin nima qolgani.</p></section>`;
}

/* ================= BOSHQA AKKAUNTGA KO'CHIRISH ================= */
const TAB = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let TCODE = "";
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tKey(secret) {
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("subfinance-transfer:" + secret));
  return crypto.subtle.importKey("raw", h, "AES-GCM", false, ["encrypt", "decrypt"]);
}
async function makeTransfer() {
  if (!inTg) return toast("Faqat Telegram ichida ishlaydi");
  try {
    const secret = [...crypto.getRandomValues(new Uint8Array(6))].map(x => TAB[x % 32]).join("");
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const pt = new TextEncoder().encode(JSON.stringify({ v: 1, cfg, DB }));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await tKey(secret), pt));
    const blob = new Uint8Array(12 + ct.length); blob.set(iv); blob.set(ct, 12);
    const r = await api("/api/backup", { data: b64(blob) });
    TCODE = `${r.id}-${secret}`; haptic("success"); render();
  } catch (e) { toast(e.message === "400" ? "Ma'lumotlar juda katta" : "Kod olib bo'lmadi. Internetni tekshiring."); }
}
async function restoreTransfer(raw) {
  const code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 11) return toast("Kod noto'g'ri: 11 ta belgi bo'lishi kerak");
  if (!inTg) return toast("Faqat Telegram ichida ishlaydi");
  const id = code.slice(0, 5), secret = code.slice(5);
  if (!await ask("Shu akkauntdagi hozirgi ma'lumotlar ko'chirilgan ma'lumotlar bilan almashtiriladi. Davom etasizmi?")) return;
  let r;
  try { r = await api("/api/restore", { id }); }
  catch (e) { return toast(e.message === "404" ? "Kod topilmadi yoki muddati o'tgan" : "Ulanib bo'lmadi. Internetni tekshiring."); }
  let data;
  try {
    const blob = unb64(r.data);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12) }, await tKey(secret), blob.slice(12));
    data = JSON.parse(new TextDecoder().decode(pt));
  } catch (e) { return toast("Kodning ikkinchi qismi noto'g'ri. Tekshirib, qayta kiriting."); }
  try {
    toast("Ko'chirilmoqda...");
    const old = []; for (const [mk, n] of Object.entries(idx)) for (let i = 0; i < n; i++) old.push(`m${mk}_${i}`);
    for (let i = 0; i < old.length; i += 20) await store.del(old.slice(i, i + 20));
    idx = {}; DB = data.DB || {};
    for (const mk of Object.keys(DB)) await saveMonth(mk);
    cfg = Object.assign({}, cfg, data.cfg || {}, { onboarded: true, lang: LANG });
    await store.set("cfg", JSON.stringify(cfg));
    api("/api/restore", { id, done: true }).catch(() => {});
    haptic("success"); toast("Ko'chirildi! Ilova qayta ochilmoqda...");
    setTimeout(() => location.reload(), 1200);
  } catch (e) { toast("Saqlashda xato. Kod hali amal qiladi, qayta urinib ko'ring."); }
}

function entryFromText(text, at) {
  const r = parseQuick(text);
  if (!(r.amount > 0)) return null;
  const dt = new Date((at || Date.now() / 1000) * 1000), d = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
  let e;
  if (r.kind === "o") {
    const f = accById(r.from), t = accById(r.to);
    if (!f || !t || f.id === t.id || f.cur !== t.cur) return null;
    e = { id: uid(), d, k: "o", a: r.amount, cur: f.cur, acc: f.id, to: t.id, n: text };
  } else {
    const res = resolve(r.kind, r.path || []);
    if (!res || !res.leaf) return null;
    const p = r.path, isItem = p[0] === CAT.BIZ && ITEM_SUBS.includes(p[2]);
    if (isItem && !(r.item && (p[2] === ITEM_CARGO || r.q > 0))) return null;
    const last = accById(cfg.lastAcc);
    let acc = r.acc || (last ? last.id : ""), cur = acc ? accById(acc).cur : (r.cur || "UZS");
    if (r.cur === "USD" && cur !== "USD") { acc = ""; cur = "USD"; }
    e = { id: uid(), d, k: r.kind, c: p[0], b: p.length === 3 ? p[1] : "", s: p[p.length - 1], a: r.amount, cur, acc, n: text };
    if (isItem) { e.item = r.item; if (p[2] !== ITEM_CARGO) e.q = r.q; }
  }
  if (e.cur === "USD" || (e.k === "o" && accById(e.to)?.cur === "USD")) e.r = +cfg.rate;
  return e;
}

}

const ymNow = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

const norm = s => String(s || "").replace(/^[^\p{L}\p{N}]+/u, "").replace(/[ʻʼ‘’`´]/g, "'").trim().toLowerCase();

  if (m) { let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }

}
function applyCfgLine(c, nc) {
  const cmd = norm(c[0].slice(1)), v = c[1] || "";
  const addTo = list => { if (v && !list.some(x => norm(x) === norm(v))) list.push(v); return !!v; };
  if (cmd === "shablon") { if (PRESETS[v]) nc.preset = v; return !!PRESETS[v]; }
  if (cmd === "hisob_ochir") { const i = nc.accounts.findIndex(x => norm(x.name) === norm(v)); if (i >= 0) nc.accounts.splice(i, 1); return i >= 0; }

  if (cmd === "mashina") return addTo(nc.cars);
  if (cmd === "biznes") return addTo(nc.biz);
  if (cmd === "hisob") {
    if (!v) return false;
    let a = nc.accounts.find(x => norm(x.name) === norm(v));
    if (!a) { a = { id: uid(), name: v }; nc.accounts.push(a); }
    a.cur = /usd|\$/i.test(c[2] || "") ? "USD" : "UZS";
    a.type = ["card", "cash", "invest", "asset", "debt", "recv"].includes(c[3]) ? c[3] : "card";

async function doImport() {
  const text = $("#imp").value;
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) { toast("Avval ro'yxatni joylang"); return; }
  const keyOf = e => [e.d, e.k, e.c, e.b, e.s, e.a, e.n, e.item || "", e.q || ""].join("|");
  const seen = new Set(allEntries().map(keyOf));
  const touched = new Set(); let added = 0, skipped = 0, dup = 0, set = 0;
  const newCfg = { ...cfg, family: [...cfg.family], cars: [...cfg.cars], biz: [...cfg.biz], accounts: cfg.accounts.map(a => ({ ...a })) };
  for (const line of lines) {
    const cols = (line.includes("\t") ? line.split("\t") : line.split(";")).map(c => c.trim());
    if (cols[0].startsWith("@")) { if (applyCfgLine(cols, newCfg)) set++; else skipped++; continue; }
    if (norm(cols[0]).startsWith("sana")) continue;
    const d = parseDate(cols[0]);
    const turi = norm(cols[1]);
    const k = turi.startsWith("xarajat") ? "x" : turi.startsWith("tushum") ? "t" : null;
    const a = parseNum(cols[5]);
    if (!d || !k || !(a > 0)) { skipped++; continue; }
    const cfgBefore = cfg; cfg = newCfg;
    const top = tree(k);
    const c = matchKey(Object.keys(top), cols[2]) || cols[2] || "📌 Boshqa";
    let b = cols[3] || "";
    if (c === CAT.FAMILY && !b) b = "Umumiy oila";
    const list = c === CAT.FAMILY ? newCfg.family : c === CAT.CAR ? newCfg.cars : c === CAT.BIZ ? newCfg.biz : null;
    if (list && b) { const ex = matchKey(list.concat(c === CAT.FAMILY ? ["Umumiy oila"] : []), b); if (ex) b = ex; else list.push(b); }
    if (!list) b = "";

    const cur = /usd|\$|dollar|usdt/i.test(cols[6] || "") ? "USD" : "UZS";
    const accObj = cols[8] ? newCfg.accounts.find(x => norm(x.name) === norm(cols[8])) : null;
    const acc = accObj ? accObj.id : "";
    const e = fixLegacy({ id: uid(), d, k, c, b, s: cols[4] || "Boshqa", a, cur, acc, n: cols[7] || "" });
    if (cur === "USD") e.r = +newCfg.rate || +cfg.rate;
    if (cols[9]) e.item = cols[9];
    if (parseNum(cols[10]) > 0) e.q = parseNum(cols[10]);

    if (seen.has(key)) { dup++; continue; }

    renderSettings();
  } catch (e) { toast("Import to'liq saqlanmadi. Internetni tekshirib, qayta urinib ko'ring."); }
}

const SYNL = {}; for (const [k, v] of Object.entries(SYN)) SYNL[k] = lat(v).split(" ");
const STOP = new Set(["boshqa", "uchun", "umumiy", "yoki", "naqd", "karta", "pro", "va"]);
const awords = lab => lat(lab).split(/[^a-z0-9]+/).filter(w => w.length >= 3);
const words = lab => lat(lab).split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !STOP.has(w));
function numVals(t) {
  if (/^\d+([.,]\d+)?$/.test(t)) return [parseFloat(t.replace(",", "."))];
  const m = t.match(/^(\d+(?:[.,]\d+)?)(k|ming|mln)$/);
  if (m) return [parseFloat(m[1].replace(",", ".")), m[2] === "mln" ? 1e6 : 1000];
  for (const w of [t, t.replace(/(ga|dan|lik|ni|dagi)$/, "")]) if (w in NUMW) return [NUMW[w]];
  return null;
}
function groupValue(vals) {
  let total = 0, cur = 0;
  for (const v of vals) {
    if (v >= 1000) { total += (cur || 1) * v; cur = 0; }
    else if (v === 100) cur = (cur || 1) * 100;
    else cur += v;
  }
  return total + cur;
}
function leafPaths(kind) {
  const out = [];
  const walk = (n, p) => { if (Array.isArray(n)) n.forEach(l => out.push([...p, l])); else Object.keys(n).forEach(k => walk(n[k], [...p, k])); };
  walk(tree(kind), []);
  return out;
}
function parseQuick(text) {
  let s = lat(text), prev;
  do { prev = s; s = s.replace(/(\d)[\s\u00a0.](\d{3})(?!\d)/g, "$1$2"); } while (s !== prev);
  const isUsd = /\$|dollar|dollor|usd/.test(s);
  const toks = s.split(/[^a-z0-9.,]+/).map(t => t.replace(/^[.,]+|[.,]+$/g, "")).filter(Boolean);
  const used = new Set(), groups = []; let g = null;
  toks.forEach((t, i) => {
    const qm = t.match(/^(\d+)(ta|dona|sht)$/);
    if (qm) { groups.push({ vals: [+qm[1]], qty: true }); used.add(i); g = null; return; }
    if (/^(ta|dona|sht|shtuk|shtuki)$/.test(t) && g) { g.qty = true; used.add(i); g = null; return; }
    const nv = numVals(t);
    if (nv) { used.add(i); if (!g) { g = { vals: [], qty: false }; groups.push(g); } g.vals.push(...nv); return; }
    if (/^(som|sum|sumov|dollar|dollor|dollara|usd)$/.test(t)) { used.add(i); g = null; return; }
    g = null;
  });
  const amounts = groups.filter(x => !x.qty).map(x => groupValue(x.vals)).filter(v => v > 0);
  const amount = amounts.length ? Math.max(...amounts) : 0;
  const qg = groups.find(x => x.qty); const q = qg ? groupValue(qg.vals) : 0;
  const ctoks = toks.filter((t, i) => !used.has(i));
  const hitLen = kws => { let L = 0; for (const k of kws) if (k && ctoks.some(t => t.startsWith(k))) L = Math.max(L, k.length); return L; };
  const hit = kws => hitLen(kws) > 0;
  const has = re => ctoks.some(t => re.test(t));
  // hisoblar
  const accHits = [];
  ctoks.forEach(t => {
    for (const a of cfg.accounts) {
      const w = awords(a.name).filter(x => !["karta", "karti", "card"].includes(x));
      const keys = a.type === "debt" || a.type === "asset" ? w.concat(a.type === "debt" ? ["nasiya", "rassroch"] : []) : w.slice(0, 1);
      if (w[0] === "naqd") keys.push("nalichn", "nalik", "kesh", "naxt");
      if (keys.some(k => t.startsWith(k)) && !accHits.some(h => h.a.id === a.id)) accHits.push({ a, t });
    }
  });
  const fixCur = a => { if (isUsd && a.cur !== "USD") { const alt = cfg.accounts.find(x => x.cur === "USD" && awords(x.name)[0] === awords(a.name)[0]); return alt || a; } return a; };
  // gap
  const gapHit = (cfg.gaps || []).length && ctoks.some(t => t.startsWith("gap"));
  if (gapHit) {
    const g = cfg.gaps.find(x => words(x.name).some(w => ctoks.some(t => t.startsWith(w)))) || cfg.gaps[0];
    const payer = accHits.find(h => ["card", "cash", "invest", "recv"].includes(h.a.type));
    const got = has(/^(oldim|oldi|navbatim|yigdim|tushdi|keldi)/);
    return got ? { kind: "o", amount, cur: g.cur, from: g.acc, to: payer ? payer.a.id : "" }
               : { kind: "o", amount, cur: g.cur, from: payer ? fixCur(payer.a).id : "", to: g.acc };
  }
  // o'tkazma
  const moneyAcc = accHits.filter(h => !["asset"].includes(h.a.type));
  const payers = accHits.filter(h => ["card", "cash", "invest", "recv"].includes(h.a.type));
  const debtHit = accHits.find(h => h.a.type === "debt" && /^(nasiya|rassroch)/.test(h.t) || h.a.type === "debt" && has(/^(nasiya|rassroch|tolov)/));
  if (debtHit && payers.length) return { kind: "o", amount, cur: isUsd ? "USD" : undefined, from: fixCur(payers[0].a).id, to: debtHit.a.id };
  const dirWords = moneyAcc.some(h => /dan$/.test(h.t)) && moneyAcc.some(h => /(ga|ka|qa)$/.test(h.t));
  if (moneyAcc.length >= 2 && (has(/^(otkaz|perevod|perevel|almashtir|obmen|yechdim|snyal|tashladim|toldirdim)/) || dirWords)) {
    const from = moneyAcc.find(h => /dan$/.test(h.t)) || moneyAcc[0];
    const to = moneyAcc.find(h => h !== from && /(ga|ka|qa)$/.test(h.t)) || moneyAcc.find(h => h !== from);
    return { kind: "o", amount, cur: isUsd ? "USD" : undefined, from: fixCur(from.a).id, to: to.a.id };
  }
  // kategoriya
  const best = kind => {
    let score = 0, paths = [];
    for (const p of leafPaths(kind)) {
      let sc = 0, depth = 0;
      p.forEach((lab, li) => {
        const isLeaf = li === p.length - 1, isMid = p.length === 3 && li === 1;
        const L = hitLen(words(lab).concat(isLeaf ? (SYNL[lab] || []) : []));
        if (L) { sc += (isMid ? 3 : isLeaf ? 2 : 1) + L * 0.01; depth = li + 1; }
      });
      if (sc > score) { score = sc; paths = [{ p, depth }]; } else if (sc === score && sc > 0) paths.push({ p, depth });
    }
    let path = [];
    if (paths.length) {
      path = paths[0].p.slice();
      for (const x of paths) { let i = 0; while (i < path.length && x.p[i] === path[i]) i++; path = path.slice(0, i); }
      path = path.slice(0, Math.max(...paths.map(x => x.depth)));
    }
    return { score, path };
  };
  const incomeWord = has(/^(tushum|kirim|keldi|tushdi|sotdim|sotildi|oylik|zarplata|maosh|poluchil|doxod|prixod|ishladim|ishlandi)/);
  const bx = best("x"), bt = best("t");
  let kind = (bt.score + (incomeWord ? 3 : 0)) > bx.score ? "t" : "x";
  let path = kind === "t" ? bt.path : bx.path, item = "";
  // biznes mahsuloti
  for (const b of cfg.biz) for (const name of Object.keys(stock(b))) {
    if (!item && hit(words(name))) {
      item = name;
      const buy = has(/^(tovar|partiya|zakaz|xarid|kupil)/);
      kind = buy ? "x" : "t";
      path = [CAT.BIZ, b, buy ? ITEM_IN : ITEM_SALE];
    }
  }
  const allowed = accHits.filter(h => ["card", "cash", "invest", "recv"].includes(h.a.type));
  let acc = allowed.length ? fixCur(allowed[0].a) : null;
  if (acc && isUsd && acc.cur !== "USD") acc = null;
  return { kind, amount, cur: isUsd ? "USD" : (acc ? acc.cur : undefined), acc: acc ? acc.id : null, path, item, q };
}
